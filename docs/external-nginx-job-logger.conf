# Example external nginx config for Job Logger in Docker Swarm.
#
# Use this when nginx and cloudflared run outside this app stack, but nginx is
# attached to the same Swarm overlay network as the Job Logger app service.
# Replace job_logger_app if the app stack name is not job_logger.
# Copy docker/nginx/errors/ into /usr/share/nginx/html/errors/ if you want the
# same app-styled nginx-generated error pages as the bundled nginx image.

map $http_x_forwarded_proto $job_logger_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_cf_connecting_ip $job_logger_client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 12m;

    error_page 400 /errors/400.html;
    error_page 401 /errors/401.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 408 /errors/408.html;
    error_page 413 /errors/413.html;
    error_page 429 /errors/429.html;
    error_page 500 /errors/500.html;
    error_page 502 /errors/502.html;
    error_page 503 /errors/503.html;
    error_page 504 /errors/504.html;

    location ^~ /errors/ {
        internal;
        root /usr/share/nginx/html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /nginx-health {
        access_log off;
        return 404;
    }

    location = /health {
        access_log off;
        return 404;
    }

    location ^~ /health/ {
        access_log off;
        return 404;
    }

    location = /api {
        access_log off;
        return 404;
    }

    location ^~ /api/ {
        access_log off;
        return 404;
    }

    location = /openapi.json {
        access_log off;
        return 404;
    }

    location ^~ /docs {
        access_log off;
        return 404;
    }

    location ^~ /redoc {
        access_log off;
        return 404;
    }

    location = /debug/restore {
        client_max_body_size 250m;
        proxy_pass http://job_logger_app:8000/debug/restore;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $job_logger_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $job_logger_forwarded_proto;
        proxy_set_header X-Real-IP $job_logger_client_ip;
        proxy_request_buffering off;
    }

    location ~ ^/jobs/[^/]+/description/audio/stream$ {
        proxy_pass http://job_logger_app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $job_logger_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $job_logger_forwarded_proto;
        proxy_set_header X-Real-IP $job_logger_client_ip;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://job_logger_app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $job_logger_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $job_logger_forwarded_proto;
        proxy_set_header X-Real-IP $job_logger_client_ip;
        proxy_request_buffering off;
    }
}
